name: takachiho-watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TZ: Asia/Tokyo
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      # 手動実行(Run workflow)した時だけ: 通知テストと読み取り確認
      - if: github.event_name == 'workflow_dispatch'
        run: |
          python takachiho_watch.py --topic "$NTFY_TOPIC" --test
          python takachiho_watch.py --topic "$NTFY_TOPIC" --dump
      - if: github.event_name == 'schedule'
        run: python takachiho_watch.py --topic "$NTFY_TOPIC" --once
